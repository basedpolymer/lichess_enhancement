<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lichess enhancement</title>
    <link rel="stylesheet" href="ressources/css/gallery.css" />
    <link rel="stylesheet" href="ressources/popup/popup.css" />
  </head>
  <body>
    <!-- The sets are listed in ressources/js/catalog.js -->
    <header class="top">
      <div class="brand">
        <picture>
          <source srcset="ressources/logo/lichess_chess_logo_white.png" media="(prefers-color-scheme: dark)" />
          <img class="logo" src="ressources/logo/lichess_chess_logo.png" alt="Lichess" width="93" height="26" />
        </picture>
        <span class="brand-sub">enhancement</span>
      </div>
      <nav>
        <a href="#" class="preview">All sets</a>
        <a href="#" class="github">GitHub</a>
      </nav>
    </header>

    <div id="permissions_banner" style="display: none">
      <p>The extension needs access to lichess.org to work.</p>
      <button id="grant_permissions">Grant access to lichess.org</button>
    </div>

    <main class="picker">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="pieces">Pieces <small></small></button>
        <button type="button" role="tab" data-tab="board">Board <small></small></button>
        <button type="button" role="tab" data-tab="sounds">Sounds <small></small></button>
      </div>
      <!-- Filled by popup.js when first shown -->
      <div class="tab-body" data-tab="pieces"></div>
      <div class="tab-body" data-tab="board" hidden></div>
      <div class="tab-body" data-tab="sounds" hidden></div>
    </main>

    <script src="ressources/js/catalog.js"></script>
    <script src="ressources/js/settings.js"></script>
    <script src="ressources/js/thumbs.js"></script>
    <script src="ressources/js/gallery.js"></script>
    <script src="ressources/js/permissions.js"></script>
    <script src="ressources/js/preview.js"></script>
    <script src="ressources/js/popup.js"></script>
  </body>
</html>
